<!DOCTYPE html>
<html lang="en">
<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>Login</title>

</head>
<style>
         body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center; 
            align-items: center; 
            box-sizing: border-box;
        }
        .login-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 20px; 
            width: 100%;
        }
        input {
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
        }
</style>
<form id="loginForm">
    <div>
      <h3>Username</h3>
      <input type="text" id="username" placeholder="Your username">
    </div>
    <div>
      <h3>Password</h3>
      <input type="password" id="password" placeholder="Your Password">
      <span class="err-tip" id="loginTip"></span>
    </div>
    <button type="submit" class="login-btn">Login</button>
  </form>
 <script>

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const loginTip = document.getElementById('loginTip');
      loginTip.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      const registeredUser = JSON.parse(localStorage.getItem('registeredUser') || '{}');

      if (!username || !password) {
        loginTip.textContent = 'Username/password cannot be empty';
        return;
      }
      if (username !== registeredUser.username || password !== registeredUser.password) {
        loginTip.textContent = 'Incorrect username or password';
        return;
      }

      alert('Login successful!');
      // window.location.href = 'home.html';
    });
  </script>
</html>
