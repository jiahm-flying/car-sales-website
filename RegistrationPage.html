<!DOCTYPE html>
<html>

<style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
        }
        div[style] {
            width: 450px;
            margin: 80px auto;
            background-color: #111;
            padding: 20px;
            border-radius: 8px;
        }
        input {
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 6px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .err-tip {
            color: #ff4444;
            font-size: 12px;
        }
        .submit-btn {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #666;
        }
</style>
    <title>Registration Page</title>
    <div style="width: 450px;margin: 80px auto;">
        <h2>Registration</h2>
        <form id="registration">
            <label>name</label>
            <input type="text" id="name" placeholder="Your Name">
            <span class="err-tip"></span><br>

            <label>address</label>
            <input type="text" id="address" placeholder="Your address">
            <span class="err-tip"></span><br>

            <label>phone number</label>
            <input type="text" id="phone" placeholder="Your phone number">
            <span class="err-tip"></span><br>

            <label>email</label>
            <input type="text" id="email" placeholder="Your email address">
            <span class="err-tip"></span><br><br>

            <label>username: at least 6 alphanumeric characters</label>
            <input type="text" id="username" placeholder="Your username">
            <span class="err-tip"></span><br><br>
            <label>password:at least 6 alphanumeric characters</label>
            <input type="password" id="password" placeholder="Your password">
            <span class="err-tip"></span><br>
            <button type="submit" class="submit-btn">registration</button>
        </form>



    </div>
    
<script>
const namePattern = /^[a-zA-Z\s]+$/;
const addressPattern = /^[a-zA-Z0-9\s]+$/;
const phonePattern = /^1[3-9]\d{9}$/;
const emailPattern = /^[^@]+@[^@]+\.(com|cn)$/;
const userPwdPattern = /^[a-zA-Z0-9]{6,}$/;

document.getElementById('registration').addEventListener('submit', function(e) {
    e.preventDefault();

    const nameInput = document.getElementById('name');
    const addressInput = document.getElementById('address');
    const phoneInput = document.getElementById('phone');
    const emailInput = document.getElementById('email');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    const nameVal = nameInput.value.trim();
    const addressVal = addressInput.value.trim();
    const phoneVal = phoneInput.value.trim();
    const emailVal = emailInput.value.trim();
    const usernameVal = usernameInput.value.trim();
    const passwordVal = passwordInput.value.trim();

    const nameTip = nameInput.nextElementSibling;
    const addressTip = addressInput.nextElementSibling;
    const phoneTip = phoneInput.nextElementSibling;
    const emailTip = emailInput.nextElementSibling;
    const usernameTip = usernameInput.nextElementSibling;
    const passwordTip = passwordInput.nextElementSibling;

    [nameTip, addressTip, phoneTip, emailTip, usernameTip, passwordTip].forEach(tip => {
        tip.textContent = '';
        tip.style.display = 'none';
    });

    if (!nameVal) {
        nameTip.textContent = 'Name cannot be empty';
        nameTip.style.display = 'inline';
        return;
    }
    if (!namePattern.test(nameVal)) {
        nameTip.textContent = 'Name can only contain letters and spaces';
        nameTip.style.display = 'inline';
        return;
    }

    if (!addressVal) {
        addressTip.textContent = 'Address cannot be empty';
        addressTip.style.display = 'inline';
        return;
    }
    if (!addressPattern.test(addressVal)) {
        addressTip.textContent = 'Address can only contain letters, numbers and spaces';
        addressTip.style.display = 'inline';
        return;
    }

    if (!phoneVal) {
        phoneTip.textContent = 'Phone number cannot be empty';
        phoneTip.style.display = 'inline';
        return;
    }
    if (!phonePattern.test(phoneVal)) {
        phoneTip.textContent = 'Please enter a valid Chinese phone number';
        phoneTip.style.display = 'inline';
        return;
    }

    if (!emailVal) {
        emailTip.textContent = 'Email cannot be empty';
        emailTip.style.display = 'inline';
        return;
    }
    if (!emailPattern.test(emailVal)) {
        emailTip.textContent = 'Email must contain one @ and end with .com or .cn';
        emailTip.style.display = 'inline';
        return;
    }

    if (!usernameVal) {
        usernameTip.textContent = 'Username cannot be empty';
        usernameTip.style.display = 'inline';
        return;
    }
    if (!userPwdPattern.test(usernameVal)) {
        usernameTip.textContent = 'Username must be at least 6 alphanumeric characters';
        usernameTip.style.display = 'inline';
        return;
    }

    if (!passwordVal) {
        passwordTip.textContent = 'Password cannot be empty';
        passwordTip.style.display = 'inline';
        return;
    }
    if (!userPwdPattern.test(passwordVal)) {
        passwordTip.textContent = 'Password must be at least 6 alphanumeric characters';
        passwordTip.style.display = 'inline';
        return;
    }

    alert('Registration successful!');
    localStorage.setItem('registeredUser', JSON.stringify({
        username: usernameVal,
        password: passwordVal
    }));
    window.location.href = 'LoginPage.html';

});
</script>
</html>
