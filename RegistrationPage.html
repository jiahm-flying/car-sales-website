<!DOCTYPE html>
<html>
    <title>Registration Page</title>
    <div style="width: 450px;margin: 80px auto;">
        <h2>Registration</h2>
        <form id="registration">
            <label>name</label>
            <input type="text" id="name" placeholder="Your Name">
            <span class="err-tip"></span><br>

            <label>address</label>
            <input type="text" id="address" placeholder="Your address">
            <span class="err-tip"></span><br>

            <label>phone number</label>
            <input type="text" id="phone" placeholder="Your phone number">
            <span class="err-tip"></span><br>

            <label>email</label>
            <input type="text" id="email" placeholder="Your email address">
            <span class="err-tip"></span><br><br>

            <label>username: at least 6 alphanumeric characters</label>
            <input type="text" id="username" placeholder="Your username">
            <span class="err-tip"></span><br><br>
            <label>password:at least 6 alphanumeric characters</label>
            <input type="password" id="password" placeholder="Your password">
            <span class="err-tip"></span><br>
        </form>
        <button type="submit" class="submit-btn">registration</button>


    </div>
    

</html>
