<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add new car</title>
    <style>
        :root {
            --primary-color: #2553eb;
            --bg-color: #121212;
            --text-color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
        }

        .form-group {
            margin-bottom: 20px; 
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            border-radius: 12px;
        }

        .image-upload {
            border: 2px dashed #444;
            padding: 24px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            border-radius: 12px;
        }

        .image-upload:hover {
            border-color: var(--primary-color);
            background: #1e1e1e;
        }

        #preview-img {
            max-width: 100%;
            margin-top: 15px;
            display: none;
            border-radius: 12px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            width: 100%;
            border-radius: 12px;
        }
        .submit-btn:hover {
            background-color: #1d4ed8;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Add New Car</h2>
    <form id="carForm">
        <div class="form-group">
            <label for="colour">Colour</label>
            <input type="text" id="colour" name="colour" required>
        </div>

        <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model" required>
        </div>

        <div class="form-group">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" min="1900" max="2026" value="2024" required>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" required>
        </div>

        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" name="price" required>
        </div>

        <div class="form-group">
            <label>Image of Car</label>
            <div class="image-upload" onclick="document.getElementById('imageInput').click()">
                <span>Click or drag the picture to upload.</span>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
                <img id="preview-img" src="#" alt="preview">
            </div>
        </div>

        <button type="submit" class="submit-btn">submit</button>
    </form>
</div>

<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('preview-img');
            output.src = reader.result;
            output.style.display = 'block';
        };
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    document.getElementById('carForm').onsubmit = function(e) {
        e.preventDefault();
        alert('submit successfully');
    };
</script>
</body>
</html>
